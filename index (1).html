<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Webtizo Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --cream:#f3f0e7; --ink:#0e1a14; --muted:#62746a; --forest:#0f4a33; --green:#1f8a54;
  --mint:#d9ebdf; --sage:#e9f0e6; --lime:#cfe86a; --sun:#f0d34a; --coal:#13201a; --red:#d9573b;
  --line:rgba(14,26,20,.09); --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(1100px 560px at 8% -8%,#dcedd5 0%,transparent 60%),
             radial-gradient(900px 520px at 100% 0%,#f7ecc4 0%,transparent 55%),var(--cream);
  background-attachment:fixed}
body.noscroll{overflow:hidden}
h1,h2,h3,h4,.disp{font-family:'Outfit','DM Sans',sans-serif;letter-spacing:-.02em}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid rgba(31,138,84,.55);outline-offset:2px}

/* background blobs */
.blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.5;z-index:-1;pointer-events:none;animation:float 20s ease-in-out infinite}
.b1{width:520px;height:520px;background:#bfe3c6;top:-160px;left:-120px}
.b2{width:460px;height:460px;background:#f3e6a5;bottom:-140px;right:-100px;animation-delay:-8s}
.b3{width:340px;height:340px;background:#cfe86a;top:40%;left:55%;opacity:.25;animation-delay:-13s}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-50px)}}

/* top bar */
.topbar{position:sticky;top:0;z-index:40;padding:14px 0}
.topbar-in{display:flex;align-items:center;gap:14px;max-width:1400px;margin:0 auto;padding:0 16px}
@media(min-width:1024px){.topbar-in{padding:0 32px}}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:42px;height:42px;border-radius:15px;background:linear-gradient(145deg,#0f4a33,#1f8a54);display:grid;place-items:center;color:#fff;box-shadow:0 10px 22px -10px rgba(15,74,51,.9)}
.brand-t{font-family:Outfit;font-weight:600;font-size:19px;line-height:1.05}
.brand-t small{display:block;font-family:'DM Sans';font-weight:500;font-size:11px;color:var(--muted);letter-spacing:0}
.tabs-wrap{flex:1;display:flex;justify-content:center;min-width:0}
.tabs{position:relative;display:flex;gap:2px;padding:5px;background:rgba(255,255,255,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:999px;border:1px solid rgba(255,255,255,.9);box-shadow:0 14px 30px -20px rgba(15,74,51,.5);overflow-x:auto;scrollbar-width:none;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;z-index:1;border:0;background:transparent;padding:9px 18px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;transition:color .3s}
.tab:hover{color:var(--ink)}
.tab.active{color:#fff}
.ink{position:absolute;left:0;top:5px;bottom:5px;border-radius:999px;background:linear-gradient(135deg,#13201a,#0f4a33);transition:transform .45s var(--ease),width .45s var(--ease);z-index:0;box-shadow:0 8px 18px -8px rgba(15,74,51,.9)}
.tb-actions{display:flex;align-items:center;gap:10px}
.search-pill{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);border-radius:999px;padding:9px 14px;color:var(--muted);font-size:13px;min-width:190px;backdrop-filter:blur(14px)}
.search-pill kbd{margin-left:auto;font:600 10px 'DM Sans';background:var(--sage);color:var(--forest);padding:3px 7px;border-radius:8px}
.icon-btn{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.85);border:1px solid var(--line);color:var(--ink);transition:transform .25s var(--ease),background .25s}
.icon-btn:hover{transform:translateY(-2px);background:#fff}
.badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:99px;background:var(--red);color:#fff;font:700 10px 'DM Sans';display:grid;place-items:center;padding:0 4px;border:2px solid var(--cream)}
.badge:empty{display:none}
.me{border:0;background:transparent;padding:0;display:flex;align-items:center;gap:10px}
@media(max-width:820px){
  .topbar-in{flex-wrap:wrap}
  .tabs-wrap{order:3;flex-basis:100%;justify-content:flex-start}
  .search-pill{min-width:0;padding:10px}.search-pill span,.search-pill kbd{display:none}
  .brand-t small{display:none}.tb-actions{margin-left:auto}
}

/* dock */
.dock{position:fixed;z-index:45;left:20px;top:50%;transform:translateY(-50%);background:linear-gradient(180deg,#1a2f24,#0c1812);border-radius:30px;padding:10px;display:flex;flex-direction:column;gap:6px;box-shadow:0 24px 50px -18px rgba(8,28,18,.7)}
.dk{position:relative;width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:#cfe3d6;display:grid;place-items:center;transition:background .25s,transform .25s var(--ease),color .25s}
.dk:hover{background:rgba(255,255,255,.12);color:#fff;transform:scale(1.08)}
.dk[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:56px;top:50%;transform:translateY(-50%);background:#fff;color:var(--ink);padding:6px 11px;border-radius:11px;font:600 12px 'DM Sans';white-space:nowrap;box-shadow:0 10px 24px -10px rgba(0,0,0,.4);pointer-events:none}
.dk-sep{height:1px;background:rgba(255,255,255,.12);margin:4px 8px}
@media(max-width:1023px){
  .dock{top:auto;bottom:14px;left:50%;transform:translateX(-50%);flex-direction:row;border-radius:999px;padding:8px 10px}
  .dk-sep{width:1px;height:auto;margin:6px 4px}.dk[data-tip]:hover::after{display:none}
}

/* layout */
.app{max-width:1400px;margin:0 auto;padding:6px 16px 130px}
@media(min-width:1024px){.app{padding:6px 32px 48px 104px}}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;margin:10px 0 20px}
.page-h h1{font-size:clamp(30px,4.2vw,46px);font-weight:600;margin:0;line-height:1.05}
.page-h p{margin:6px 0 0;color:var(--muted);font-size:14px}

/* cards */
.card{position:relative;background:rgba(255,255,255,.74);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);border:1px solid rgba(255,255,255,.9);border-radius:28px;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 22px 44px -28px rgba(15,74,51,.35);padding:22px;transition:transform .4s var(--ease),box-shadow .4s}
.card.lift:hover{transform:translateY(-3px);box-shadow:inset 0 1px 0 #fff,0 30px 50px -26px rgba(15,74,51,.45)}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.card-h h2{font-size:18px;font-weight:600;margin:0}
.card-h p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.dark{background:linear-gradient(150deg,#1b3528,#0b1a12);color:#fff;border-color:rgba(255,255,255,.06)}
.forest{background:linear-gradient(150deg,#12593d,#0a3322 75%);color:#fff;border-color:rgba(255,255,255,.08)}
.limec{background:linear-gradient(150deg,#dcf080,#bfdf55);color:#16210a;border-color:rgba(255,255,255,.5)}
.dim{color:rgba(255,255,255,.66)}
.hero{overflow:hidden}
.hero::before{content:"";position:absolute;inset:-60%;}
.hero>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}

/* reveal (view change only) */
.animate .reveal{animation:rise .75s var(--ease) backwards;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.985)}}

/* buttons / chips */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,#0f4a33,#1f8a54);color:#fff;font-weight:600;font-size:14px;padding:11px 18px;border-radius:999px;border:0;box-shadow:0 14px 26px -14px rgba(15,74,51,.9);transition:transform .25s var(--ease),box-shadow .3s}
.btn:hover{transform:translateY(-2px);box-shadow:0 18px 30px -14px rgba(15,74,51,.95)}
.btn:active{transform:scale(.96)}
.btn-ghost{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.9);color:var(--ink);font-weight:600;font-size:14px;padding:10px 16px;border-radius:999px;border:1px solid var(--line);transition:transform .25s var(--ease),background .2s}
.btn-ghost:hover{transform:translateY(-2px);background:#fff}
.btn-sm{padding:7px 12px;font-size:12.5px}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.4);transform:scale(0);animation:ripple .6s ease-out;pointer-events:none}
@keyframes ripple{to{transform:scale(4);opacity:0}}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sage);color:var(--forest);white-space:nowrap}
.chip.sun{background:#faf0b3;color:#6b5a05}.chip.red{background:#fde3dc;color:#a23a22}
.chip.coal{background:var(--coal);color:#fff}.chip.lime{background:var(--lime);color:#2c3d08}
.chip.glass{background:rgba(255,255,255,.16);color:#fff}.chip.white{background:#fff;color:var(--ink)}
.chip.btnchip{border:1px solid var(--line);background:rgba(255,255,255,.8);color:var(--muted);padding:7px 13px;transition:all .2s}
.chip.btnchip.on{background:var(--coal);color:#fff;border-color:var(--coal)}
.toggle{display:inline-flex;background:var(--sage);border-radius:999px;padding:4px}
.toggle button{border:0;background:transparent;padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--muted);transition:all .25s}
.toggle button.on{background:#fff;color:var(--ink);box-shadow:0 4px 10px -4px rgba(0,0,0,.2)}

/* kpi strip */
.kpis{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.kpi{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.9);border-radius:999px;padding:8px 20px 8px 8px}
.kpi-i{width:38px;height:38px;border-radius:50%;background:var(--sage);color:var(--forest);display:grid;place-items:center}
.kpi b{display:block;font:600 18px Outfit;line-height:1.1}.kpi small{font-size:12px;color:var(--muted)}

/* tiles */
.tile{border-radius:26px;padding:20px;min-height:160px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.tile .ico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.tile .lbl{font-size:13px;font-weight:600;opacity:.78}
.tile .val{font:600 clamp(26px,2.6vw,34px) Outfit;letter-spacing:-.02em}
.tile.white{background:rgba(255,255,255,.82);border:1px solid #fff}
.tile.white .ico{background:var(--sage);color:var(--forest)}
.tile.limec .ico{background:rgba(22,33,10,.12)}.tile.dark .ico{background:rgba(255,255,255,.12)}

/* currency boxes */
.cur-box{border:1.5px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);color:#fff;border-radius:18px;padding:10px 12px;text-align:left;transition:all .3s var(--ease)}
.cur-box small{display:block;font-size:11px;font-weight:700;color:rgba(255,255,255,.6)}
.cur-box b{font:600 15px Outfit}
.cur-box:hover{background:rgba(255,255,255,.14)}
.cur-box.on{background:var(--lime);border-color:var(--lime);color:#16210a;transform:translateY(-2px)}
.cur-box.on small{color:rgba(22,33,10,.65)}

/* bars & rings */
.bar{height:10px;background:rgba(14,26,20,.09);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#1f8a54,#cfe86a);transition:width 1.3s var(--ease)}
.bar.warn>i{background:linear-gradient(90deg,#e5b93a,#f0d34a)}.bar.bad>i{background:linear-gradient(90deg,#d9573b,#f08a6e)}
.ring-fg{transition:stroke-dashoffset 1.5s var(--ease)}

/* rows */
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:20px;border:0;background:rgba(233,240,230,.55);color:inherit;transition:background .2s,transform .25s var(--ease)}
.row:hover{background:var(--mint);transform:translateX(3px)}
.row.sel{background:var(--coal);color:#fff}
.row .t{font-weight:600;font-size:14px;line-height:1.25}.row .s{font-size:12px;color:var(--muted)}
.row.sel .s{color:rgba(255,255,255,.6)}
.av{display:inline-grid;place-items:center;border-radius:50%;font-weight:700;flex-shrink:0;font-family:Outfit}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.live{background:var(--green);box-shadow:0 0 0 4px rgba(31,138,84,.18)}.dot.setup{background:var(--sun)}.dot.pending{background:#b8c4bb}
.list{display:flex;flex-direction:column;gap:8px}
.scroll{overflow-y:auto;scrollbar-width:thin;scrollbar-color:#bfd8c6 transparent}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:26px 10px}
.item-in{animation:itemIn .5s var(--ease)}
@keyframes itemIn{from{opacity:0;transform:translateX(-16px) scale(.97)}}

/* task checkbox */
.check{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:8px;border:2px solid #b5d3bf;display:grid;place-content:center;cursor:pointer;transition:all .25s;flex-shrink:0;background:#fff}
.check:checked{background:var(--green);border-color:var(--green)}
.check:checked::after{content:"✓";color:#fff;font-size:13px;font-weight:800;animation:pop .3s var(--ease)}
@keyframes pop{from{transform:scale(0)}}

/* kanban */
.board{display:grid;grid-template-columns:repeat(3,minmax(270px,1fr));gap:16px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.kcol{scroll-snap-align:start;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.8);border-radius:30px;padding:14px;min-height:340px;transition:background .25s,outline-color .25s;outline:2px dashed transparent;outline-offset:-4px}
.kcol.over,.zone.over{background:rgba(207,232,106,.4);outline-color:var(--green)}
.kcol-h{display:flex;align-items:center;gap:8px;padding:4px 6px 12px;font-weight:700}
.kcol-h small{font-weight:500;color:var(--muted);margin-left:auto;font-size:12px}
.kc{display:block;width:100%;text-align:left;border:0;border-radius:24px;padding:16px;margin-bottom:12px;cursor:grab;position:relative;transition:transform .3s var(--ease),box-shadow .3s,opacity .2s}
.kc:hover{transform:translateY(-3px) rotate(-.4deg);box-shadow:0 18px 30px -18px rgba(0,0,0,.5)}
.kc.dragging{opacity:.35;transform:scale(.96)}
.kc h4{font:600 16.5px/1.2 Outfit;margin:12px 0 2px}
.kc p{margin:0;font-size:12.5px;opacity:.75}
.kc-f{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.kc-f b{font:600 20px Outfit}
.k-sun{background:#f0d34a;color:#2b2503}.k-green{background:linear-gradient(150deg,#12593d,#0c3d29);color:#fff}.k-coal{background:linear-gradient(150deg,#1d2f25,#0e1a14);color:#fff}
.kc-act{display:flex;gap:4px;margin-top:12px}
.kc-act button{border:0;border-radius:99px;width:28px;height:28px;display:grid;place-items:center;background:rgba(255,255,255,.2);color:inherit;transition:background .2s,transform .2s}
.k-sun .kc-act button{background:rgba(43,37,3,.12)}
.kc-act button:hover{background:rgba(255,255,255,.4);transform:scale(1.1)}
.kc-act .sp{flex:1}
@media(hover:hover){.kc-act{opacity:0;transform:translateY(-4px);transition:all .25s}.kc:hover .kc-act,.kc:focus-within .kc-act{opacity:1;transform:none}}
.kadd{width:100%;border:2px dashed rgba(14,26,20,.14);background:transparent;border-radius:20px;padding:11px;font-weight:600;font-size:13px;color:var(--muted);transition:all .2s}
.kadd:hover{border-color:var(--green);color:var(--forest);background:rgba(255,255,255,.6)}
.zone{border-radius:24px;padding:16px 20px;display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.7);border:1px solid #fff;outline:2px dashed transparent;outline-offset:-4px;transition:all .25s;width:100%;text-align:left;color:inherit}
.tc{background:rgba(255,255,255,.92);border-radius:22px;padding:14px;margin-bottom:10px;cursor:grab;border:1px solid #fff;box-shadow:0 10px 24px -20px rgba(15,74,51,.7);transition:transform .3s var(--ease),box-shadow .3s}
.tc:hover{transform:translateY(-2px)}.tc.dragging{opacity:.35}
.tc h4{font:600 15px/1.3 'DM Sans';margin:8px 0}
.tc.done h4{text-decoration:line-through;color:var(--muted)}
.prio{width:8px;height:8px;border-radius:50%}.prio.high{background:var(--red)}.prio.med{background:var(--sun)}.prio.low{background:var(--green)}

/* table */
.tbl{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:14px}
.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:0 14px 4px}
.tbl td{background:rgba(255,255,255,.8);padding:12px 14px}
.tbl td:first-child{border-radius:18px 0 0 18px}.tbl td:last-child{border-radius:0 18px 18px 0}
.tbl tr.item-in td{background:#ecf6c9}
.amt{font:600 15px Outfit;white-space:nowrap}.amt.in{color:var(--green)}.amt.out{color:var(--red)}.amt.inv{color:var(--forest)}.amt.pen{color:#a37f08}
.x-btn{border:0;background:transparent;color:#9db0a3;width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;transition:all .2s}
.x-btn:hover{background:#fde3dc;color:var(--red)}

/* client detail */
.info-row{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.info-row:last-child{border:0}
.info-row label{font-size:12px;color:var(--muted);font-weight:600}
.plain{width:100%;background:transparent;border:1.5px solid transparent;border-radius:12px;padding:7px 10px;font:600 14px 'DM Sans';color:var(--ink);outline:none;transition:all .2s}
.plain:hover{background:rgba(233,240,230,.7)}.plain:focus{background:#fff;border-color:var(--green)}
select.plain{appearance:none;-webkit-appearance:none}
.stepper{display:flex;gap:8px}
.step{flex:1;border:0;border-radius:18px;padding:12px;text-align:center;font-size:13px;font-weight:600;background:rgba(233,240,230,.8);color:var(--muted);transition:all .35s var(--ease)}
.step.done{background:var(--mint);color:var(--forest)}.step.cur{background:var(--coal);color:#fff;transform:translateY(-2px)}
.ncard{border-radius:22px;padding:14px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;font-size:13.5px;position:relative}
.ncard small{opacity:.7;font-size:12px}.ncard b{font:600 17px Outfit}
.ncard.sun{background:#f0d34a;color:#2b2503}.ncard.coal{background:var(--coal);color:#fff}.ncard.green{background:var(--forest);color:#fff}.ncard.white{background:#fff}.ncard.lime{background:var(--lime);color:#16210a}
.ncard .x-btn{position:absolute;top:8px;right:8px;color:inherit;opacity:.5;width:26px;height:26px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-h{font-size:12px;font-weight:600;color:var(--muted);text-align:center;padding-bottom:4px}
.day{aspect-ratio:1/.86;min-height:54px;border-radius:18px;border:0;background:rgba(255,255,255,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font:600 15px Outfit;color:var(--ink);transition:all .25s var(--ease)}
.day:hover{background:#fff;transform:translateY(-2px)}
.day.blank{background:transparent;pointer-events:none}
.day.today{box-shadow:inset 0 0 0 2px var(--green)}
.day.sel{background:var(--coal);color:#fff;transform:translateY(-2px)}
.dots{display:flex;gap:3px;height:6px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--green)}.dots i.t{background:var(--sun)}
.agenda{display:flex;gap:14px;padding:14px;border-radius:22px;background:rgba(255,255,255,.8)}
.agenda .tm{min-width:64px;font:600 13px Outfit;color:var(--forest)}
.agenda.task{background:#fbf5cf}

/* forms / modal */
#overlay{position:fixed;inset:0;z-index:100;display:none}
#overlay.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(10,24,17,.45);backdrop-filter:blur(7px);animation:fade .25s}
@keyframes fade{from{opacity:0}}

let charts=[];
function buildCharts(anim){
  charts.forEach(c=>c.destroy());charts=[];if(!window.Chart)return;
  Chart.defaults.font.family="'DM Sans',system-ui,sans-serif";Chart.defaults.color='#62746a';
  const tip={backgroundColor:'#13201a',titleColor:'#fff',bodyColor:'#dfe9e2',padding:12,cornerRadius:14,boxPadding:4};
  const A=anim?{duration:1100,easing:'easeOutQuart'}:false;
  const pl=$('#plChart');
  if(pl){const keys=lastMonths(7),earn=keys.map(k=>monthTotals(k).earn),spend=keys.map(k=>monthTotals(k).spend),net=earn.map((v,i)=>v-spend[i]),mode=S.ui.chartMode;
    const ds=mode==='net'?[{label:'Net profit',data:net,backgroundColor:net.map((v,i)=>v<0?'#e8826a':i===net.length-1?'#0f4a33':'#8cc7a1'),borderRadius:14,borderSkipped:false,maxBarThickness:48}]
      :[{label:'Earning',data:earn,backgroundColor:'#0f4a33',borderRadius:12,borderSkipped:false,maxBarThickness:30},{label:'Spend',data:spend,backgroundColor:'#cfe86a',borderRadius:12,borderSkipped:false,maxBarThickness:30}];
    charts.push(new Chart(pl,{type:'bar',data:{labels:keys.map(k=>monthLabel(k)),datasets:ds},options:{responsive:true,maintainAspectRatio:false,animation:A,plugins:{legend:{display:mode!=='net',align:'end',labels:{usePointStyle:true,boxWidth:8}},tooltip:{...tip,callbacks:{label:c=>` ${c.dataset.label}: ${fmtINR(c.raw)}`,afterBody:mode==='net'?it=>{const i=it[0].dataIndex;return [`Earning ${fmtINR(earn[i])}`,`Spend ${fmtINR(spend[i])}`]}:undefined}}},scales:{x:{grid:{display:false},border:{display:false}},y:{grid:{color:'rgba(14,26,20,.06)'},border:{display:false},ticks:{callback:v=>compact(v),maxTicksLimit:5}}}}}));}
  const qd=$('#qrDonut');
  if(qd){const c=['live','setup','pending'].map(k=>S.clients.filter(x=>x.status===k).length);
    charts.push(new Chart(qd,{type:'doughnut',data:{labels:['Live','In setup','Pending'],datasets:[{data:c,backgroundColor:['#1f8a54','#f0d34a','#c8d3cb'],borderWidth:0,spacing:4,borderRadius:8}]},options:{cutout:'74%',animation:A?{duration:1200}:false,plugins:{legend:{display:false},tooltip:tip}}}));}
  const ed=$('#expDonut');
  if(ed){const m=S.ui.month,cats={};S.tx.filter(t=>monthOf(t.date)===m&&t.type==='expense').forEach(t=>cats[t.category]=(cats[t.category]||0)+t.amount);const e=Object.entries(cats).sort((a,b)=>b[1]-a[1]);
    charts.push(new Chart(ed,{type:'doughnut',data:{labels:e.map(x=>x[0]),datasets:[{data:e.map(x=>x[1]),backgroundColor:['#0f4a33','#1f8a54','#7fbf98','#cfe86a','#f0d34a','#13201a'],borderWidth:0,spacing:3,borderRadius:6}]},options:{maintainAspectRatio:false,cutout:'68%',animation:A?{duration:1000}:false,plugins:{legend:{display:false},tooltip:{...tip,callbacks:{label:c=>` ${c.label}: ${fmtINR(c.raw)}`}}}}}));}
}

/* ================= render ================= */
function tween(el,from,to,fmt,dur=900){const t0=performance.now();(function step(t){const p=Math.min((t-t0)/dur,1),e=1-Math.pow(1-p,4);el.textContent=fmt(from+(to-from)*e);if(p<1)requestAnimationFrame(step)})(t0)}
function runCount(el){const to=+el.dataset.count,f=el.dataset.fmt;
  if(f==='cur')return tween(el,0,to*CUR[S.cur].rate,v=>fmtCur(v,S.cur),1200);
  tween(el,0,to,v=>num(v),1200)}
function render(animate=false,opts={}){
  const app=$('#app'),ae=document.activeElement,keep=ae&&ae.id&&app.contains(ae)?{id:ae.id,s:ae.selectionStart,e:ae.selectionEnd}:null,sy=window.scrollY;
  app.classList.toggle('animate',animate);
  app.innerHTML=VIEWS[S.ui.view]();
  $$('.reveal',app).forEach((el,i)=>el.style.setProperty('--i',Math.min(i,14)));
  buildCharts(animate||opts.chart);
  if(animate)$$('[data-count]',app).forEach(runCount);
  $$('[data-w]',app).forEach(el=>{if(animate)requestAnimationFrame(()=>requestAnimationFrame(()=>el.style.width=el.dataset.w));else{el.style.transition='none';el.style.width=el.dataset.w}});
  $$('.ring-fg',app).forEach(el=>{if(animate)requestAnimationFrame(()=>requestAnimationFrame(()=>el.style.strokeDashoffset=el.dataset.off));else{el.style.transition='none';el.style.strokeDashoffset=el.dataset.off}});
  updateChrome();
  if(keep){const el=document.getElementById(keep.id);if(el){el.focus();try{el.setSelectionRange(keep.s,keep.e)}catch{}}}
  animate?window.scrollTo({top:0}):window.scrollTo({top:sy});
}

function moveDeal(id,stage){const d=byId(S.deals,id);if(!d||d.stage===stage)return;const was=d.stage;d.stage=stage;
  if(was==='won'){S.tx=S.tx.filter(t=>t.dealId!==d.id);d.closed=''}
  if(stage==='won'){d.closed=todayISO();S.tx.unshift({id:uid(),type:'income',title:`${d.client} – ${d.title}`,amount:d.value,date:todayISO(),category:'QR menu setup',clientId:S.clients.find(c=>c.biz===d.client)?.id||'',dealId:d.id});toast(`Deal won. ${fmtINR(d.value)} added to earnings`)}
  else if(stage==='lost'){d.closed=todayISO();toast('Deal marked as lost')}
  else if(was==='won'||was==='lost')toast('Deal reopened');
  save();render()}
function moveTask(id,status){const t=byId(S.tasks,id);if(!t||t.status===status)return;t.status=status;save();render();if(status==='done')toast('Task completed')}

document.addEventListener('click',e=>{
  const b=e.target.closest('.btn');if(b){const r=b.getBoundingClientRect(),s=document.createElement('span'),d=Math.max(r.width,r.height);s.className='ripple';s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.appendChild(s);setTimeout(()=>s.remove(),600)}
  const el=e.target.closest('[data-act]');if(!el)return;const fn=A[el.dataset.act];if(!fn)return;
  if(el.type==='checkbox'){fn(el,e);return}
  fn(el,e)});
document.addEventListener('submit',e=>{const f=e.target;const k=f.dataset.form;if(!k)return;e.preventDefault();
  if(k==='quickTask'){const i=$('#qt');const t={id:uid(),title:i.value.trim(),status:'todo',prio:'med',due:addDays(1),client:'',_new:true};if(!t.title)return;S.tasks.unshift(t);save();render();delete t._new;toast('Task added')}
  if(k==='note'){const i=$('#noteIn'),c=byId(S.clients,f.dataset.cid);if(!i.value.trim())return;c.notes=c.notes||[];c.notes.unshift({id:uid(),text:i.value.trim(),date:todayISO(),tone:['sun','coal','green','white','lime'][c.notes.length%5]});save();render();toast('Note added')}});
document.addEventListener('input',e=>{const b=e.target.dataset.bind;if(b){S.ui[b]=e.target.value;render()}});
document.addEventListener('change',e=>{const f=e.target.dataset.field;if(!f)return;const c=byId(S.clients,e.target.dataset.cid);if(!c)return;let v=e.target.value;if(f==='tables'||f==='fee')v=+v||0;c[f]=v;save();render();toast('Saved')});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();mSearch()}if(e.key==='Escape')closeModal()});
/* drag and drop */
let drag=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest('[data-drag]');if(!c)return;drag={kind:c.dataset.drag,id:c.dataset.id};c.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',c.dataset.id)});
document.addEventListener('dragend',()=>{$$('.dragging,.over').forEach(x=>x.classList.remove('dragging','over'));drag=null});
document.addEventListener('dragover',e=>{const z=e.target.closest('[data-drop]');if(!z||!drag||z.dataset.drop.split(':')[0]!==drag.kind)return;e.preventDefault();$$('.over').forEach(x=>x!==z&&x.classList.remove('over'));z.classList.add('over')});
document.addEventListener('drop',e=>{const z=e.target.closest('[data-drop]');if(!z||!drag)return;const [k,t]=z.dataset.drop.split(':');if(k!==drag.kind)return;e.preventDefault();const id=drag.id;drag=null;k==='deal'?moveDeal(id,t):moveTask(id,t)});
window.addEventListener('resize',moveInk);
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(VIEWS[h]&&h!==S.ui.view){S.ui.view=h;render(true)}});

/* ================= boot ================= */
load();chrome();render(true);
document.fonts?.ready.then(moveInk);
})();
</script>
</body>
</html>
